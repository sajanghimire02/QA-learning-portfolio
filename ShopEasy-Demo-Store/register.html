<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopEasy Demo Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">ShopEasy <span>Demo</span></div>
            <nav id="main-nav">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html" class="cart-icon">
                    Cart
                    <span class="cart-badge">0</span>
                </a>
                <a href="login.html" class="auth-link">Login</a>
                <a href="register.html" class="auth-link">Register</a>
                <a href="orders.html" class="user-link" style="display:none;">Orders</a>
                <a href="profile.html" class="user-link" style="display:none;">Profile</a>
                <a href="#" class="user-link" style="display:none;" onclick="handleLogout()">Logout</a>
                <span class="user-name-display" style="display:none;"></span>
            </nav>
        </div>
    </header>

    <div id="notification-container"></div>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>Create Your Account</h1>
                <p>Join ShopEasy to start shopping</p>
            </div>

            <!-- ============================================================
            REGISTRATION FORM
            ---------------------------------------------------------------
            QA Note for Testers:
            This form handles new user registration. Things to test:

            1. REQUIRED FIELDS:
               - What happens if you leave fields empty?
               - Are all fields marked as required?

            2. EMAIL VALIDATION:
               - Test invalid formats: "test", "test@", "@test.com", "test@.com"
               - Test valid formats: "test@example.com", "test.name@example.co.uk"

            3. PASSWORD VALIDATION:
               - Test minimum length requirements (if any)
               - Test that password and confirm password must match
               - Test with weak passwords like "123" or "password"

            4. DUPLICATE REGISTRATION:
               - Try registering twice with the same email address
               - What happens to the first account?

            5. BOUNDARY TESTING:
               - Very long names or emails
               - Special characters in name field
               - Spaces before/after email (should be trimmed)

            6. UI TESTING:
               - Error messages display correctly
               - Success message after registration
               - Form clears after successful registration (or redirects)
               - Tab order between fields
            ============================================================ -->

            <form class="auth-form" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="Confirm your password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>

                <div class="form-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 ShopEasy Demo Store — Built for QA Testing Practice</p>
        </div>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
