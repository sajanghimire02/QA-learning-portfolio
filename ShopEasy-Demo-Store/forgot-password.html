<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ShopEasy Demo Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">ShopEasy <span>Demo</span></div>
            <nav id="main-nav">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html" class="cart-icon">
                    Cart
                    <span class="cart-badge">0</span>
                </a>
                <a href="login.html" class="auth-link">Login</a>
                <a href="register.html" class="auth-link">Register</a>
                <a href="orders.html" class="user-link" style="display:none;">Orders</a>
                <a href="profile.html" class="user-link" style="display:none;">Profile</a>
                <a href="#" class="user-link" style="display:none;" onclick="handleLogout()">Logout</a>
                <span class="user-name-display" style="display:none;"></span>
            </nav>
        </div>
    </header>

    <div id="notification-container"></div>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>Forgot Password</h1>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

            <!-- ============================================================
            FORGOT PASSWORD FORM
            ---------------------------------------------------------------
            QA Note for Testers:
            This form simulates password reset functionality. Things to test:

            1. VALID EMAIL:
               - Enter a registered email address
               - Does it show a success message?

            2. INVALID EMAIL:
               - Enter an email that was never registered
               - Does it still show a success message? (Security consideration)
               - Should it reveal whether the email exists?

            3. EMPTY SUBMISSION:
               - Click "Send Reset Link" with empty field
               - Does it show an error message?

            4. INVALID FORMAT:
               - Enter something that isn't an email
               - Is there any validation before submission?

            SECURITY NOTE:
            In real applications, telling a user that an email doesn't exist
            can be a security risk (it confirms emails to attackers).
            However, claiming success for non-existent emails can confuse
            legitimate users. This is a real-world testing consideration!
            ============================================================ -->

            <form class="auth-form" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="forgot-email">Email Address</label>
                    <input type="email" id="forgot-email" class="form-control" placeholder="Enter your registered email">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>

                <div class="form-footer">
                    <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 ShopEasy Demo Store — Built for QA Testing Practice</p>
        </div>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
